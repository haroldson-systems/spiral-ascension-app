<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Observer</title>
  <desc id="desc">A glowing open circle against a midnight blue field.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#15284d"/>
      <stop offset="58%" stop-color="#071225"/>
      <stop offset="100%" stop-color="#020712"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="300" r="122" fill="none" stroke="#f4f7ff" stroke-width="13" filter="url(#glow)" opacity="0.96"/>
  <circle cx="400" cy="300" r="170" fill="none" stroke="#8fb5ff" stroke-width="2" opacity="0.16"/>
  <circle cx="400" cy="300" r="228" fill="none" stroke="#d8e3ff" stroke-width="1" opacity="0.08"/>
</svg>
